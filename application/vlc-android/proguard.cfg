# --- VLC M3U release shrinking rules ---
-keepattributes SourceFile,LineNumberTable
-keepattributes *Annotation*
-keepattributes Signature
-keepattributes InnerClasses
-keepattributes EnclosingMethod

# Keep the whole app / library codebase to avoid reflective crashes
-keep class org.videolan.** { *; }

# Parcelable
-keep class * implements android.os.Parcelable {
  public static final android.os.Parcelable$Creator *;
}

# Enums
-keepclassmembers enum * { *; }

# Native / JNI
-keepclasseswithmembers class * {
    native <methods>;
}

# Data binding generated classes
-keep class * extends android.databinding.DataBinderMapper { *; }
-keep class android.databinding.** { *; }
-keep class org.videolan.vlc.databinding.** { *; }

# Message / R8 safe defaults for reflection-heavy libs used by VLC
-dontwarn org.videolan.**
-dontwarn com.google.android.material.**
-dontnote org.videolan.**