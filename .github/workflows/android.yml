# VLC for Android —— GitHub Actions 自动构建 APK
# 触发:push(默认分支) / 手动(workflow_dispatch)
# 说明:vlc-android 未自带 gradle wrapper,故用 gradle/actions/setup-gradle 安装 Gradle。
#      默认自动构建 Debug APK(看效果足够);若仓库已配置签名 Secrets 则额外构建并发布 Release。
name: Build VLC-Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: '额外构建签名 Release APK(需已配置签名 Secrets,耗时长)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17(AGP 要求)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK + 构建工具
        uses: android-actions/setup-android@v3

      # vlc-android 无 gradle wrapper,显式安装 Gradle
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # build.gradle 会无条件读取 local.properties,缺失会直接报错,必须先生成
      - name: 生成 local.properties(CI 必需)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "# VLC3 需要 NDK 21(支持 minSdk 17);VLC4 用 NDK 28" >> local.properties
          # echo "android.ndkPath=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses || true

      # settings.gradle 会无条件 include ':libvlcjni:libvlc',
      # 该目录属于独立仓库,官方流程由 buildsystem/compile.sh 先克隆。缺失会配置阶段报错。
      - name: 克隆 libvlcjni(settings.gradle 依赖)
        run: |
          git clone --single-branch --branch libvlcjni-3.x \
            https://code.videolan.org/videolan/libvlcjni.git libvlcjni 2>&1 || git clone https://code.videolan.org/videolan/libvlcjni.git libvlcjni
          ls libvlcjni >/dev/null

      # 决定构建任务:默认只构建 Debug(无需签名);已配置签名 Secrets 或手动勾选时追加 SignedRelease
      - name: 决定构建任务
        id: tasks
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          BUILD_RELEASE: ${{ github.event.inputs.build_release }}
        run: |
          if [ -n "$HAS_KEYSTORE" ] || [ "$BUILD_RELEASE" = "true" ]; then
            echo "tasks=assembleDebug assembleSignedRelease" >> "$GITHUB_OUTPUT"
          else
            echo "tasks=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      # 仅当签名 Secrets 存在时才还原 keystore(SignedRelease 需要)
      - name: 还原签名 keystore(可选)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vlc-release.keystore"
          ls -l "$RUNNER_TEMP/vlc-release.keystore"

      - name: 执行 Gradle 构建
        env:
          PASSWORD_KEYSTORE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle "${{ steps.tasks.outputs.tasks }}" \
            -PkeyStoreFile="$RUNNER_TEMP/vlc-release.keystore" \
            -Pstorealias="${{ secrets.KEY_ALIAS }}" \
            --no-daemon --stacktrace

      - name: 上传 Debug APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: vlc-android-apk-debug
          path: |
            **/build/outputs/apk/debug/**/*.apk
          if-no-files-found: ignore
          compression-level: 0

      - name: 上传其余 APK 产物(签名 Release / Dev 等)
        uses: actions/upload-artifact@v4
        with:
          name: vlc-android-apk-other
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          compression-level: 0

      # 成功后把 APK 发布到 GitHub Release(若构建了产物)
      - name: 自动发布到 GitHub Release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vlc-android-build-${{ github.run_number }}
          name: "VLC-Android 自动构建 #${{ github.run_number }}"
          body: |
            本次构建由 GitHub Actions 自动生成。
            提交: `${{ github.sha }}`
            安装包已作为构建产物(Artifacts)与 Release 附件提供,直接下载对应 .apk 即可。
          files: |
            **/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}